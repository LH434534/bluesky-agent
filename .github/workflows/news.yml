name: agent-news

on:
  schedule:
    - cron: "3 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: agent-news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: fetch real news, corroborate, draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.fame_run || echo "nothing corroborated this run"
      - name: commit
        run: |
          git config user.name "ratman4080"
          git config user.email "bot@nest.local"
          git add state/
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "agent: news draft [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push || (git pull --rebase origin ${{ github.ref_name }} && git push)
          fi
