name: hunt

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: copilot token exchange
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.hunt3 2>&1 | tee state/hunt3.log

      - name: copilot header shapes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.hunt4 2>&1 | tee -a state/hunt3.log

      - name: official ai-inference action
        id: ai
        uses: actions/ai-inference@v1
        continue-on-error: true
        with:
          prompt: "Reply with exactly: rat-alive"
          model: openai/gpt-4o-mini
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: capture action output
        run: |
          mkdir -p state
          {
            echo "=== ai-inference action ==="
            echo "outcome: ${{ steps.ai.outcome }}"
            echo "response: ${{ steps.ai.outputs.response }}"
            echo "error: ${{ steps.ai.outputs.error }}"
          } 2>&1 | tee -a state/hunt3.log

      - name: commit findings
        run: |
          git config user.name "ratman4080"
          git config user.email "bot@nest.local"
          git add state/
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "hunt: findings [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push || (git pull --rebase origin ${GITHUB_REF_NAME} && git push)
          fi
