name: hunt

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: gh CLI + gh-models extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p state
          {
            echo "=== gh version ==="
            gh --version 2>&1 | head -2
            echo "=== install gh-models ==="
            gh extension install github/gh-models 2>&1 | tail -5
            echo "exit=$?"
            echo "=== gh models list ==="
            gh models list 2>&1 | head -20
            echo "=== gh models run ==="
            gh models run openai/gpt-4o-mini --prompt "Reply with exactly: rat-alive" 2>&1 | head -20
            echo "=== gh models run (no org slash) ==="
            gh models run gpt-4o-mini --prompt "Reply with exactly: rat-alive" 2>&1 | head -20
            echo "=== gh copilot suggest ==="
            echo "list files" | gh copilot suggest -t shell 2>&1 | head -15
          } 2>&1 | tee -a state/hunt3.log

      - name: copilot header shapes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.hunt4 2>&1 | tee -a state/hunt3.log

      - name: commit findings
        run: |
          git config user.name "ratman4080"
          git config user.email "bot@nest.local"
          git add state/
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "hunt: findings [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push || (git pull --rebase origin ${GITHUB_REF_NAME} && git push)
          fi
