name: hunt

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: round 6 — copilot cli
        env:
          GH_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          set +e
          mkdir -p state
          {
            echo "--- copilot help ---"
            gh copilot --help 2>&1 | head -20
            echo "--- form A: quoted single word ---"
            gh copilot suggest -p "rat-alive" 2>&1 | head -10
            echo "--- form B: -i flag ---"
            gh copilot suggest -i "rat-alive" 2>&1 | head -10
            echo "--- form C: bare copilot -p ---"
            copilot -p "rat-alive" 2>&1 | head -10
            echo "--- form D: explain ---"
            gh copilot explain "ls" 2>&1 | head -10
            echo "--- form E: ai-inference action ---"
          } > state/hunt6.log 2>&1
          cat state/hunt6.log

      - name: ai-inference action
        id: ai
        uses: actions/ai-inference@v1
        continue-on-error: true
        with:
          prompt: "Reply with exactly: rat-alive"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: capture ai action
        run: |
          {
            echo "outcome=${{ steps.ai.outcome }}"
            echo "response=${{ steps.ai.outputs.response }}"
          } >> state/hunt6.log 2>&1
          cat state/hunt6.log

      - name: commit findings
        run: |
          git config user.name "ratman4080"
          git config user.email "bot@nest.local"
          git add state/hunt6.log
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "hunt: round6 [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push || (git pull --rebase origin ${GITHUB_REF_NAME} && git push)
          fi
