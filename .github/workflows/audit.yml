name: audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run invariant suite
        id: audit
        run: |
          set +e
          python -m src.audit
          code=$?
          echo "audit_exit=$code" >> $GITHUB_OUTPUT
          exit $code
      - name: commit report
        if: always()
        run: |
          git config user.name "ratman4080"
          git config user.email "bot@nest.local"
          git add state/audit.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "audit: report [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push || (git pull --rebase origin ${GITHUB_REF_NAME} && git push)
          fi
      - name: open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "audit: invariants quebraram",
              body: `Run ${context.runId} — verifique state/audit.json.`
            })
